name: Renderer 5.0 Build Gate
on:
  push:
    branches: [dev/renderer500]
    paths: ['VERSION','src/**','assets/**','tools/**','.github/workflows/ci-renderer500.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile native client
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          $crt=@('ucrt.lib','legacy_stdio_definitions.lib','legacy_stdio_wide_specifiers.lib','vcruntime.lib')
          clang-cl /nologo /TC /O2 /GS- /Oi- /c src/native.c /Fo:dist/native.obj
          if ($LASTEXITCODE -ne 0) { throw 'native compile failed' }
          lld-link /nologo /entry:WinMainCRTStartup /subsystem:windows /machine:x64 /nodefaultlib /out:dist/ItajaiDriveNative.exe dist/native.obj kernel32.lib user32.lib gdi32.lib winhttp.lib ws2_32.lib iphlpapi.lib opengl32.lib winmm.lib @crt
          if ($LASTEXITCODE -ne 0) { throw 'native link failed' }
      - name: Validate 5.0 asset pipeline
        shell: pwsh
        run: |
          python -m py_compile tools/compile_assets.py tools/generate_vehicle_gltf.py tools/generate_vehicle_hq.py tools/generate_vehicle_parts.py
          python tools/generate_vehicle_gltf.py
          python tools/generate_vehicle_hq.py
          python tools/generate_vehicle_parts.py
          $generated=Get-ChildItem assets/generated/*.gltf | Sort-Object Name | ForEach-Object { $_.FullName }
          python tools/compile_assets.py -o dist/itajai_assets_v08.pak assets/source/tree.gltf assets/source/streetlamp.gltf assets/source/container.gltf assets/source/palm.gltf assets/source/bench.gltf assets/source/busstop.gltf assets/source/guardrail.gltf assets/source/roadsign.gltf @generated
          if ($LASTEXITCODE -ne 0) { throw '5.0 asset compilation failed' }
          @"
          ITAJAI DRIVE // RENDERER 5.0 DEVELOPMENT BUILD
          Branch: $env:GITHUB_REF_NAME
          Commit: $env:GITHUB_SHA

          This is a development checkpoint, not a public release.
          Keep ItajaiDriveNative.exe and itajai_assets_v08.pak in the same folder.
          Press TAB in-game to show renderer/FPS/quality telemetry.
          "@ | Set-Content -Encoding ascii dist/DEV_BUILD.txt
      - name: Upload Renderer 5.0 development build
        uses: actions/upload-artifact@v4
        with:
          name: ItajaiDrive-Renderer500-${{ github.sha }}
          path: |
            dist/ItajaiDriveNative.exe
            dist/itajai_assets_v08.pak
            dist/DEV_BUILD.txt
          if-no-files-found: error
          retention-days: 14
