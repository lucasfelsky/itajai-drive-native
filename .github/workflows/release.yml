name: Build and Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if (-not $version) { throw 'VERSION is empty' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Build native executables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          $crt = @('ucrt.lib', 'legacy_stdio_definitions.lib', 'legacy_stdio_wide_specifiers.lib', 'vcruntime.lib')

          clang-cl /nologo /TC /O2 /GS- /Oi- /c src/native.c /Fo:dist/native.obj
          if ($LASTEXITCODE -ne 0) { throw 'native.c compile failed' }
          lld-link /nologo /entry:WinMainCRTStartup /subsystem:windows /machine:x64 /nodefaultlib /out:dist/ItajaiDriveNative.exe dist/native.obj kernel32.lib user32.lib gdi32.lib winhttp.lib ws2_32.lib iphlpapi.lib opengl32.lib winmm.lib @crt
          if ($LASTEXITCODE -ne 0) { throw 'native link failed' }

          clang-cl /nologo /TC /O2 /GS- /Oi- /c src/updater.c /Fo:dist/updater.obj
          if ($LASTEXITCODE -ne 0) { throw 'updater.c compile failed' }
          lld-link /nologo /entry:WinMainCRTStartup /subsystem:windows /machine:x64 /nodefaultlib /out:dist/ItajaiDriveUpdater.exe dist/updater.obj kernel32.lib user32.lib gdi32.lib winhttp.lib @crt
          if ($LASTEXITCODE -ne 0) { throw 'updater link failed' }
          Copy-Item dist/ItajaiDriveUpdater.exe dist/ItajaiDriveUpdater.next.exe -Force

      - name: Validate Internet relay
        shell: pwsh
        run: |
          python -m py_compile server/relay_server.py server/test_relay.py
          if ($LASTEXITCODE -ne 0) { throw 'relay Python validation failed' }
          python server/test_relay.py
          if ($LASTEXITCODE -ne 0) { throw 'relay integration test failed' }
          Copy-Item server/relay_server.py dist/ItajaiDriveRelay.py -Force

      - name: Compile glTF/GLB runtime assets
        shell: pwsh
        run: |
          python tools/generate_vehicle_gltf.py
          if ($LASTEXITCODE -ne 0) { throw 'vehicle glTF generation failed' }
          python tools/generate_vehicle_parts.py
          if ($LASTEXITCODE -ne 0) { throw 'vehicle part generation failed' }
          $generated = Get-ChildItem assets/generated/*.gltf | Sort-Object Name | ForEach-Object { $_.FullName }
          python tools/compile_assets.py -o dist/itajai_assets_v08.pak assets/source/tree.gltf assets/source/streetlamp.gltf assets/source/container.gltf assets/source/palm.gltf assets/source/bench.gltf assets/source/busstop.gltf assets/source/guardrail.gltf assets/source/roadsign.gltf @generated
          if ($LASTEXITCODE -ne 0) { throw 'asset compilation failed' }

      - name: Generate updater channel files
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = '${{ steps.version.outputs.tag }}'
          $repo = '${{ github.repository }}'
          $baseUrl = "https://github.com/$repo/releases/download/$tag/"

          $version | Set-Content -Encoding ascii dist/VERSION.txt
          @"
          manifest_url=https://github.com/$repo/releases/latest/download/manifest.txt
          auto_launch=1
          "@ | Set-Content -Encoding ascii dist/update_config.ini

          python tools/make_manifest.py --version $version --base-url $baseUrl --notes "Itajai Drive Native $version" dist/ItajaiDriveNative.exe dist/itajai_assets_v08.pak dist/ItajaiDriveUpdater.next.exe | Set-Content -Encoding ascii dist/manifest.txt

          Get-FileHash dist/ItajaiDriveNative.exe -Algorithm SHA256
          Get-FileHash dist/ItajaiDriveUpdater.exe -Algorithm SHA256
          Get-FileHash dist/ItajaiDriveUpdater.next.exe -Algorithm SHA256
          Get-FileHash dist/itajai_assets_v08.pak -Algorithm SHA256
          Get-FileHash dist/ItajaiDriveRelay.py -Algorithm SHA256

      - name: Validate release candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/release_check.py
          if ($LASTEXITCODE -ne 0) { throw 'release candidate validation failed' }

      - name: Create tag if needed
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --tags
          if (-not (git tag --list $tag)) {
            git tag $tag
            git push origin $tag
          }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $files = @(
            'dist/ItajaiDriveNative.exe',
            'dist/ItajaiDriveUpdater.exe',
            'dist/ItajaiDriveUpdater.next.exe',
            'dist/itajai_assets_v08.pak',
            'dist/ItajaiDriveRelay.py',
            'dist/VERSION.txt',
            'dist/update_config.ini',
            'dist/manifest.txt'
          )

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "Itajai Drive Native ${{ steps.version.outputs.version }}" --generate-notes
          }
